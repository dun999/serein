services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_BIND:-127.0.0.1:6382}:6379"
    tmpfs:
      - /data

  ext-proxy:
    image: ${REGISTRY:-local}/tee-proxy
    volumes:
      - ./config/proxy/extension_proxy.docker.toml:/app/config/config.toml:ro
    environment:
      - PROXY_PRIVATE_KEY=${PROXY_PRIVATE_KEY:?Set PROXY_PRIVATE_KEY or use scripts/start-services.sh for local defaults}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${EXT_PROXY_INTERNAL_BIND:-0.0.0.0:6673}:6663"
      - "${EXT_PROXY_EXTERNAL_BIND:-0.0.0.0:6674}:6664"
    depends_on:
      - redis

  extension-tee:
    build:
      context: .
      # Selected by LANGUAGE in .env; start-services.sh resolves <LANGUAGE>/Dockerfile
      # by directory convention. Adding a language needs no change here.
      dockerfile: ${EXTENSION_DOCKERFILE:-go/Dockerfile}
      args:
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}
    env_file:
      - path: ./config/extension.env
        required: false
    environment:
      - MODE=${MODE:-1}
      # Chain id the node binds signatures to — must match the proxy's chain_id
      # and the chain itself. Local e2e Hardhat = 31337; the Coston2 override
      # sets 114.
      - CHAIN_ID=${CHAIN_ID:-31337}
      - INITIAL_OWNER=${INITIAL_OWNER:?Set INITIAL_OWNER or use scripts/start-services.sh for local defaults}
      # TEE governance the node signs with. Must match what set-governance
      # registers on-chain (post-build reads the same vars). Defaults to the
      # deployer (INITIAL_OWNER) as sole signer, threshold 1; override in .env.
      - GOVERNANCE_SIGNERS=${GOVERNANCE_SIGNERS:-${INITIAL_OWNER}}
      - GOVERNANCE_THRESHOLD=${GOVERNANCE_THRESHOLD:-1}
      - PROXY_URL=http://ext-proxy:6663
      - CONFIG_PORT=5501
      - SIGN_PORT=7701
      - EXTENSION_PORT=7702
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SIMULATED_TEE=${SIMULATED_TEE:-true}
      # Covenant's confidential policy engine. Signing and ECIES decryption use
      # tee-node's registered machine key through loopback-only endpoints.
      - COSTON2_RPC_URL=${COSTON2_RPC_URL:-https://coston2-api.flare.network/ext/C/rpc}
      - FTSO_V2_ADDRESS=${FTSO_V2_ADDRESS:-0xC4e9c78EA53db782E28f28Fdf80BaF59336B304d}
      - TEE_SIGN_URL=http://127.0.0.1:7701/sign
    depends_on:
      - ext-proxy

networks:
  default:
    name: ${COMPOSE_NETWORK:-docker_default}
    external: true
