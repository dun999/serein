[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "@flarenetwork/flare-periphery-contracts/=node_modules/@flarenetwork/flare-periphery-contracts/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"
